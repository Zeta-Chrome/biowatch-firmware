# Interface and Target
source [find interface/stlink.cfg]
source [find target/stm32wbx.cfg]

adapter speed 4000

# ─── DBGMCU ────────────────────────────────────────────────────────────────
set DBGMCU_BASE    0xE0042000
set DBGMCU_CR      [expr { $DBGMCU_BASE + 0x04 }]
set APB1FZR1       [expr { $DBGMCU_BASE + 0x3C }]
set APB1FZR2       [expr { $DBGMCU_BASE + 0x40 }]
set APB2FZR        [expr { $DBGMCU_BASE + 0x44 }]
set C2APB1FZR1     [expr { $DBGMCU_BASE + 0x48 }]
set C2APB1FZR2     [expr { $DBGMCU_BASE + 0x4C }]
set C2APB2FZR      [expr { $DBGMCU_BASE + 0x50 }]

proc configure_dbgmcu {} {
    # Keep debug clocks active during Sleep (bit 0), Stop (bit 1), Standby (bit 2)
    mww $::DBGMCU_CR   0x00000007
    # Freeze peripheral timers when halted
    mww $::APB1FZR1    0x00001BFF
    mww $::APB1FZR2    0x00000020
    mww $::APB2FZR     0x00070001
    mww $::C2APB1FZR1  0x00001BFF
    mww $::C2APB1FZR2  0x00000020
    mww $::C2APB2FZR   0x00070001
}

# ─── Events ────────────────────────────────────────────────────────────────

$_TARGETNAME configure -event reset-init {
    configure_dbgmcu
}

$_TARGETNAME configure -event halted {
    configure_dbgmcu
}

$_TARGETNAME configure -event gdb-attach {
    halt
    catch { cortex_m maskisr off }
    configure_dbgmcu
}

# ─── RTT Helper ────────────────────────────────────────────────────────────
proc rtt_start {port {addr 0x20000008}} {
    halt
    configure_dbgmcu
    rtt setup $addr 0x30 "SEGGER RTT"
    rtt start
    rtt server start $port 0
    resume
}
